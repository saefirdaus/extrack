services:
  postgres:
    image: postgres:16-alpine
    container_name: extrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-extrack_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Named volume digunakan untuk memastikan kompatibilitas cross-platform (Windows, macOS, Linux)
      # tanpa kendala permission atau filesystem performance pada host bind mount
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-extrack_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
